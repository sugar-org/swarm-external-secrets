name: Smoke Tests

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"
      - "mkdocs.yml"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"
      - "mkdocs.yml"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        provider: [vault, openbao]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - name: Init Docker Swarm
        run: docker swarm init

      - name: Run smoke test for ${{ matrix.provider }}
        run: bash scripts/tests/smoke-test-${{ matrix.provider }}.sh

  # Real Infisical credentials are withheld from fork pull requests and
  # Dependabot. Same-repository runs still fail when those secrets are unset.
  smoke-test-infisical:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - name: Init Docker Swarm
        run: docker swarm init

      - name: Run smoke test for infisical
        env:
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_SMOKE_TOKEN: ${{ secrets.INFISICAL_SMOKE_TOKEN }}
          INFISICAL_SMOKE_CLIENT_ID: ${{ secrets.INFISICAL_SMOKE_CLIENT_ID }}
          INFISICAL_SMOKE_CLIENT_SECRET: ${{ secrets.INFISICAL_SMOKE_CLIENT_SECRET }}
          INFISICAL_ENVIRONMENT: ${{ vars.INFISICAL_SMOKE_ENVIRONMENT }}
          INFISICAL_SECRET_PATH: ${{ vars.INFISICAL_SMOKE_SECRET_PATH }}
          INFISICAL_SITE_URL: ${{ vars.INFISICAL_SMOKE_SITE_URL }}
        run: bash scripts/tests/smoke-test-infisical.sh

  smoke-test-kv-custom-path:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        provider: [vault-custom-path, openbao-custom-path]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - name: Init Docker Swarm
        run: docker swarm init

      - name: Run smoke test for ${{ matrix.provider }}
        run: bash scripts/tests/smoke-test-${{ matrix.provider }}.sh


  smoke-test-awssm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - name: Init Docker Swarm
        run: docker swarm init

      # Floci is a lightweight open-source AWS emulator started by the smoke test
      # itself, so no LocalStack auth token / license is required. The aws CLI is
      # preinstalled on ubuntu-latest runners.
      - name: Run smoke test for awssm
        run: bash scripts/tests/smoke-test-awssm.sh

  smoke-test-jwt-renewal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        provider: [vault-jwt, openbao-jwt]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - name: Init Docker Swarm
        run: docker swarm init

      - name: Run JWT renewal smoke test for ${{ matrix.provider }}
        run: bash scripts/tests/smoke-test-${{ matrix.provider }}.sh
