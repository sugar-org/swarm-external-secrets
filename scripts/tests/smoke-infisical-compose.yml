services:
  backend:
    image: infisical/infisical:v0.165.16@sha256:6b911e3938ac2ff385a782df59ce9272799be7976d26dc5667266a2aecac4116
    environment:
      NODE_ENV: production
      ENCRYPTION_KEY: ${INFISICAL_LOCAL_ENCRYPTION_KEY:?}
      AUTH_SECRET: ${INFISICAL_LOCAL_AUTH_SECRET:?}
      DB_CONNECTION_URI: postgres://infisical:${INFISICAL_LOCAL_DB_PASSWORD:?}@db:5432/infisical
      REDIS_URL: redis://redis:6379
      SITE_URL: https://localhost:${INFISICAL_LOCAL_PORT:-8443}
      TELEMETRY_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: ${INFISICAL_LOCAL_DB_PASSWORD:?}
      POSTGRES_DB: infisical
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical -d infisical"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
  tls:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${INFISICAL_LOCAL_PORT:-8443}:443"
    volumes:
      - ${INFISICAL_LOCAL_DIR:?}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${INFISICAL_LOCAL_DIR:?}/server.crt:/etc/nginx/server.crt:ro
      - ${INFISICAL_LOCAL_DIR:?}/server.key:/etc/nginx/server.key:ro
    depends_on:
      - backend
