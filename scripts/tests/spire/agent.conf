agent {
  data_dir = "/tmp/spire-agent/data"
  log_level = "INFO"
  server_address = "smoke-spire-server"
  server_port = 8081
  socket_path = "/run/spire/agent-sockets/api.sock"
  trust_bundle_path = "/run/spire/bootstrap/bootstrap.crt"
  trust_domain = "example.org"
  join_token_file = "/run/spire/bootstrap/join-token"
}

plugins {
  NodeAttestor "join_token" {
    plugin_data {}
  }

  KeyManager "disk" {
    plugin_data {
      directory = "/tmp/spire-agent/data"
    }
  }

  WorkloadAttestor "unix" {
    plugin_data {}
  }
}
